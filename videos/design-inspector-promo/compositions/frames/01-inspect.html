  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="01-inspect"]');
      const q = (selector) => root.querySelector(selector);
      const qa = (selector) => Array.from(root.querySelectorAll(selector));
      const tl = gsap.timeline({ paused: true });

      const traced = qa('.f01-trace-layer rect');
      traced.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      tl.fromTo('#f01-browser', { opacity: 0, y: 28, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: 'power3.out' }, 0);
      tl.fromTo('.f01-depth-back', { opacity: 0, x: 70 }, { opacity: 0.48, x: 0, duration: 0.55, ease: 'power3.out' }, 0.12);
      tl.fromTo('.f01-depth-mid', { opacity: 0, x: 55 }, { opacity: 0.72, x: 0, duration: 0.5, ease: 'power3.out' }, 0.2);
      tl.fromTo('.f01-page-kicker', { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.34, ease: 'power3.out' }, 0.16);
      tl.fromTo('#f01-page-title', { opacity: 0, y: 52 }, { opacity: 1, y: 0, duration: 0.58, ease: 'power4.out' }, 0.2);
      tl.fromTo('.f01-page-copy', { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.46, ease: 'power3.out' }, 0.38);
      tl.fromTo('#f01-cta', { opacity: 0, y: 46, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'power4.out' }, 0.48);
      tl.fromTo('.f01-proof-row', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 0.68);

      tl.fromTo('#f01-cursor', { opacity: 0, x: 0, y: 0, rotation: -8 }, { opacity: 1, x: 270, y: -156, rotation: 0, duration: 0.88, ease: 'power2.inOut' }, 0.25);

      tl.to('#f01-heading-trace', { strokeDashoffset: 0, duration: 0.42, ease: 'power2.out' }, 1.2);
      tl.to('#f01-heading-trace', { opacity: 0.18, duration: 0.18, ease: 'power1.out' }, 1.58);
      tl.to('#f01-button-trace', { strokeDashoffset: 0, duration: 0.38, ease: 'power2.out' }, 1.68);
      tl.to('#f01-button-trace', { opacity: 0.22, duration: 0.18, ease: 'power1.out' }, 2.02);
      tl.to('#f01-selection-trace', { strokeDashoffset: 0, duration: 0.42, ease: 'power2.out' }, 2.08);
      tl.to('.f01-handle', { opacity: 1, duration: 0.16, stagger: 0.035, ease: 'power1.out' }, 2.34);

      const sequence = [
        { key: 'heading', title: 'h1.hero', body: 'hover', hold: 0.22 },
        { key: 'button', title: '.cta', body: 'hover', hold: 0.28 },
        { key: 'selected', title: '.cta', body: 'selected', hold: 0.46 }
      ];
      let cumulative = 0;
      const sequenceTimeline = sequence.map((entry) => {
        const duration = 0.18 + entry.body.length * 0.014 + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      const sequenceDriver = { t: 0 };
      let lastKey = '';
      const entryAt = (time) => {
        for (let i = sequenceTimeline.length - 1; i >= 0; i -= 1) {
          if (time >= sequenceTimeline[i].start) return sequenceTimeline[i];
        }
        return sequenceTimeline[0];
      };
      tl.to(sequenceDriver, {
        t: cumulative,
        duration: 1.42,
        ease: 'none',
        onUpdate: () => {
          const entry = entryAt(sequenceDriver.t);
          if (entry.key !== lastKey) {
            q('#f01-sequence-title').textContent = entry.title;
            q('#f01-sequence-body').textContent = entry.body;
            const chip = q('#f01-selector-chip');
            if (entry.key === 'heading') {
              chip.style.left = '774px';
              chip.style.top = '204px';
            } else {
              chip.style.left = '584px';
              chip.style.top = '502px';
            }
            lastKey = entry.key;
          }
        }
      }, 1.2);
      tl.fromTo('#f01-selector-chip', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.22, ease: 'power2.out' }, 1.25);

      tl.to('#f01-cursor', { scale: 0.86, duration: 0.08, ease: 'power2.in' }, 2.72);
      tl.to('#f01-cta', { scale: 0.95, duration: 0.08, ease: 'power2.in' }, 2.72);
      tl.to('#f01-cursor', { scale: 1, duration: 0.08, ease: 'power2.out' }, 2.8);
      tl.to('#f01-cta', { scale: 1, duration: 0.08, ease: 'power2.out' }, 2.8);
      tl.set('#f01-ripple', { opacity: 1, scale: 0 }, 2.74);
      tl.to('#f01-ripple', { scale: 4.2, opacity: 0, duration: 0.68, ease: 'power2.out', immediateRender: false }, 2.74);

      tl.set('#f01-panel', { opacity: 1, x: 350, scale: 0.14, borderRadius: 100 }, 2.7);
      tl.to('#f01-panel', {
        x: 0,
        scale: 1,
        borderRadius: 14,
        backgroundColor: '#ffffff',
        duration: 0.78,
        ease: 'power2.inOut'
      }, 2.78);
      tl.to('.f01-panel-old', { opacity: 0, duration: 0.3, ease: 'power1.in' }, 2.78);
      tl.to('#f01-panel-new', { opacity: 1, duration: 0.3, ease: 'power1.out' }, 3.25);

      const F = 1 / 60;
      const waterfall = [
        { selector: '#f01-panel-head', y: 76, duration: 0.19, overlap: 0 },
        { selector: '#f01-tabs', y: 48, duration: 0.15, overlap: 1 },
        { selector: '#f01-target', y: 44, duration: 0.145, overlap: 1 },
        { selector: '#f01-panel-section-a', y: 40, duration: 0.13, overlap: 2 },
        { selector: '#f01-panel-section-b', y: 36, duration: 0.115, overlap: 2 }
      ];
      let waterfallAt = 3.32;
      waterfall.forEach((item) => {
        tl.set(item.selector, { opacity: 1, y: item.y }, waterfallAt);
        tl.to(item.selector, { y: 0, duration: item.duration, ease: 'power4.out' }, waterfallAt);
        waterfallAt += item.duration - item.overlap * F;
      });

      tl.set('#f01-message', { opacity: 1 }, 3.46);
      const messageParts = [
        { selector: '.f01-message-rule', y: 72, duration: 0.19, overlap: 0 },
        { selector: '#f01-word-inspect', y: 50, duration: 0.16, overlap: 1 },
        { selector: '#f01-word-any', y: 44, duration: 0.14, overlap: 1 },
        { selector: '#f01-word-interface', y: 66, duration: 0.16, overlap: 2 },
        { selector: '#f01-word-dot', y: 38, duration: 0.11, overlap: 2 }
      ];
      let wordAt = 3.46;
      messageParts.forEach((item) => {
        tl.set(item.selector, { opacity: 1, y: item.y }, wordAt);
        tl.to(item.selector, { y: 0, duration: item.duration, ease: 'power4.out' }, wordAt);
        wordAt += item.duration - item.overlap * F;
      });

      tl.to('#f01-selector-chip', { backgroundColor: '#171e31', duration: 0.24, ease: 'power1.out' }, 3.98);
      tl.to('#f01-selection-trace', { strokeWidth: 3, duration: 0.24, ease: 'power1.out' }, 3.98);

      window.__timelines = window.__timelines || {};
      window.__timelines['01-inspect'] = tl;
    })();
