  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const q = (id) => document.getElementById(id);

      const radiusState = { value: 8 };
      const paddingState = { value: 20 };
      const radiusValue = q("f02-tune-radius-value");
      const radiusChip = q("f02-tune-chip-top").querySelector("b");
      const paddingValue = q("f02-tune-padding-value");
      const leftMeasure = q("f02-tune-measure-left-value");
      const rightMeasure = q("f02-tune-measure-right-value");

      tl.fromTo("#f02-tune-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .58, ease: "power3.out" }, .08);
      tl.fromTo("#f02-tune-layout-group", { opacity: .35, scaleY: .78 }, { opacity: 1, scaleY: 1, duration: .62, ease: "power3.out" }, .08);
      ["#f02-tune-chip-top", "#f02-tune-chip-left", "#f02-tune-chip-right"].forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, scale: 0, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: .48, ease: "power3.out" }, .25 + i * .08);
      });
      tl.fromTo(".f02-tune-binding-line", { opacity: 0, scaleX: .18 }, { opacity: 1, scaleX: 1, duration: .6, transformOrigin: "0% 50%", ease: "power3.out" }, .54);

      tl.addLabel("radius-edit", 1.2);
      tl.fromTo("#f02-tune-cursor", { x: -20, y: -16, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: .34, ease: "power3.out" }, "radius-edit");
      tl.to("#f02-tune-cursor", { x: 58, duration: 1.18, ease: "power1.inOut" }, "radius-edit+=.18");
      tl.to(radiusState, {
        value: 24, duration: 1.18, ease: "power1.inOut",
        onUpdate: () => { const value = Math.round(radiusState.value); radiusValue.textContent = value; radiusChip.textContent = value; }
      }, "radius-edit+=.18");
      tl.to("#f02-tune-target-button, .f02-tune-select-box", { borderRadius: 24, duration: 1.18, ease: "power1.inOut" }, "radius-edit+=.18");
      tl.to("#f02-tune-radius-fill", { scaleX: 1, duration: 1.18, ease: "power1.inOut" }, "radius-edit+=.18");

      tl.addLabel("padding-edit", 3.0);
      tl.to("#f02-tune-panel-content", { y: -82, duration: .5, ease: "power3.out" }, "padding-edit");
      tl.to("#f02-tune-cursor", { x: -12, y: 51, duration: .38, ease: "power3.out" }, "padding-edit");
      tl.to("#f02-tune-cursor", { x: 54, duration: 1.12, ease: "power1.inOut" }, "padding-edit+=.38");
      tl.to(paddingState, {
        value: 32, duration: 1.12, ease: "power1.inOut",
        onUpdate: () => { const value = Math.round(paddingState.value); paddingValue.textContent = value; leftMeasure.textContent = value; rightMeasure.textContent = value; }
      }, "padding-edit+=.38");
      tl.to("#f02-tune-target-wrap", { scaleX: 1.2, duration: 1.12, ease: "power1.inOut" }, "padding-edit+=.38");
      tl.to("#f02-tune-target-label", { scaleX: .8333, duration: 1.12, ease: "power1.inOut" }, "padding-edit+=.38");
      tl.to("#f02-tune-chip-left", { x: -28, duration: 1.12, ease: "power1.inOut" }, "padding-edit+=.38");
      tl.to("#f02-tune-chip-right", { x: 28, duration: 1.12, ease: "power1.inOut" }, "padding-edit+=.38");
      tl.to("#f02-tune-padding-fill", { scaleX: 1, duration: 1.12, ease: "power1.inOut" }, "padding-edit+=.38");

      tl.addLabel("token-edit", 4.8);
      tl.to("#f02-tune-cursor", { x: -105, y: 138, duration: .34, ease: "power3.out" }, "token-edit");
      const TOKEN_CONTENT = [
        { key: "slate", hold: .12 },
        { key: "blue", hold: .12 },
        { key: "violet", hold: .48 }
      ];
      let tokenTime = 0;
      const TOKEN_TIMELINE = TOKEN_CONTENT.map((entry) => {
        const start = tokenTime; tokenTime += entry.hold; return { ...entry, start, end: tokenTime };
      });
      const tokenAt = (time) => {
        for (let i = TOKEN_TIMELINE.length - 1; i >= 0; i--) if (time >= TOKEN_TIMELINE[i].start) return TOKEN_TIMELINE[i];
        return TOKEN_TIMELINE[0];
      };
      const tokenDriver = { t: 0 };
      let lastToken = "";
      tl.to(tokenDriver, {
        t: tokenTime, duration: tokenTime, ease: "none",
        onUpdate: () => {
          const entry = tokenAt(tokenDriver.t);
          if (entry.key !== lastToken) {
            document.querySelectorAll(".f02-tune-swatch").forEach((el) => el.classList.toggle("f02-tune-swatch-active", el.dataset.swatch === entry.key));
            if (entry.key === "slate") gsap.set("#f02-tune-target-button", { backgroundColor: "#171e31", color: "#ffffff" });
            if (entry.key === "blue") gsap.set("#f02-tune-target-button", { backgroundColor: "#3b82f6", color: "#ffffff" });
            if (entry.key === "violet") gsap.set("#f02-tune-target-button", { backgroundColor: "#7c3cff", color: "#ffffff" });
            lastToken = entry.key;
          }
        }
      }, "token-edit+=.25");
