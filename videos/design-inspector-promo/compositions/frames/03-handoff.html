  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="03-handoff"]');
      const q = (selector) => root.querySelector(selector);
      const page = q('#frame-03-handoff-page');
      const selected = q('#frame-03-handoff-selected');
      const morph = q('#frame-03-handoff-morph-card');
      const oldContent = q('#frame-03-handoff-old');
      const newContent = q('#frame-03-handoff-new');
      const actionWrap = q('#frame-03-handoff-action-wrap');
      const copy = q('#frame-03-handoff-copy');
      const copied = q('#frame-03-handoff-copied');
      const pointer = q('#frame-03-handoff-pointer');
      const finalLine = q('#frame-03-handoff-final');
      const ripple = q('#frame-03-handoff-ripple');

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['03-handoff'] = tl;

      gsap.set(morph, { scale: 0.72, transformOrigin: '50% 50%' });
      gsap.set(pointer, { x: 1420, y: 700, opacity: 0, scale: 1, transformOrigin: '0 0' });

      tl.to(page, { opacity: 0.18, duration: 0.72, ease: 'power2.out' }, 0.05);
      tl.to(selected, { scale: 0.72, x: 880, y: -531, borderRadius: 24, duration: 0.78, ease: 'power2.inOut' }, 0.12);
      tl.to(morph, {
        x: -504,
        y: 156,
        scale: 1,
        borderRadius: 14,
        backgroundColor: '#ffffff',
        boxShadow: '0 0 0 rgba(0,0,0,0)',
        duration: 0.82,
        ease: 'power2.inOut'
      }, 0.12);
      tl.to(oldContent, { opacity: 0, duration: 0.34, ease: 'power1.in' }, 0.18);
      tl.fromTo(newContent, { opacity: 0 }, { opacity: 1, duration: 0.34, ease: 'power1.out' }, 0.62);
      tl.to(page, { opacity: 0, duration: 0.2, ease: 'power1.out' }, 0.78);

      const sequences = [
        [
          { t: 1.00, text: '' }, { t: 1.08, text: '14' }, { t: 1.18, text: '14px' }, { t: 1.28, text: '14px 32px' }
        ],
        [
          { t: 1.00, text: '' }, { t: 1.38, text: '2' }, { t: 1.48, text: '24' }, { t: 1.58, text: '24px' }
        ],
        [
          { t: 1.00, text: '' }, { t: 1.70, text: 'var(' }, { t: 1.82, text: 'var(--brand' }, { t: 1.95, text: 'var(--brand-50' }, { t: 2.04, text: 'var(--brand-5' }, { t: 2.13, text: 'var(--brand-500)' }
        ]
      ];

      const typeNodes = [q('#frame-03-handoff-type-1'), q('#frame-03-handoff-type-2'), q('#frame-03-handoff-type-3')];
      const cursorNodes = [q('#frame-03-handoff-cursor-1'), q('#frame-03-handoff-cursor-2'), q('#frame-03-handoff-cursor-3')];
      const typeDriver = { t: 0 };
      const latest = (states, time) => {
        for (let i = states.length - 1; i >= 0; i -= 1) {
          if (time >= states[i].t) return states[i].text;
        }
        return '';
      };

      tl.to(typeDriver, {
        t: 4,
        duration: 4,
        ease: 'none',
        onUpdate: () => {
          typeNodes.forEach((node, i) => { node.textContent = latest(sequences[i], typeDriver.t); });
          cursorNodes.forEach((node, i) => {
            const starts = [1.0, 1.34, 1.66];
            const ends = [1.34, 1.66, 2.18];
            const active = typeDriver.t >= starts[i] && typeDriver.t < ends[i];
            node.style.opacity = active && Math.sin(typeDriver.t * Math.PI * 12) > 0 ? '1' : '0';
          });
        }
      }, 0);

      tl.to(morph, { scale: 0.72, opacity: 0, duration: 0.38, ease: 'power2.in' }, 2.20);
      tl.fromTo(actionWrap, { scale: 0.72, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: 'back.out(1.8)' }, 2.43);

      tl.to([copy, pointer], { scale: 1, duration: 0.22, ease: 'back.out(1.6)' }, 2.80);
      tl.to(copy, { boxShadow: 'inset 0 0 0 0 rgba(255,255,255,0)', duration: 0.22, ease: 'power2.out' }, 2.80);

      tl.to(copy, { scale: 0.72, opacity: 0, duration: 0.20, ease: 'power2.in' }, 3.00);
      tl.fromTo(copied, { scale: 0.72, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: 'back.out(1.5)' }, 3.08);
      tl.fromTo(finalLine, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.48, ease: 'power3.out' }, 3.12);
      tl.fromTo(ripple, { opacity: 0.45, scale: 0.55 }, { opacity: 0, scale: 2.1, duration: 0.64, ease: 'power2.out' }, 3.10);
      tl.to(pointer, { opacity: 0.35, x: 1010, y: 550, duration: 0.34, ease: 'power2.out' }, 3.20);
      tl.to({}, { duration: 0.46 }, 3.54);
